site_name: Kothok AI Documentation
site_description: How to set up, run, and get the most from your Kothok AI shop assistant.
site_url: https://docs.kothok.ai/
repo_url: https://github.com/visieai/kothok-ai-docs
repo_name: visieai/kothok-ai-docs
copyright: Copyright &copy; Visie AI

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started:
      - Getting started: getting-started/overview.md
      - First-time setup: getting-started/first-setup.md
      - Dashboard tour: getting-started/dashboard-tour.md
      - Install the widget: getting-started/install-widget.md
  - Train your assistant:
      - Overview: knowledge-base/overview.md
      - Add knowledge: knowledge-base/add-knowledge.md
      - Keep it updated: knowledge-base/keep-updated.md
  - Booking meetings:
      - Overview: appointments/overview.md
      - Connect your calendar: appointments/connect-calendar.md
      - Manage your bookings: appointments/manage-bookings.md
  - Conversations & inbox:
      - The inbox: conversations/inbox.md
      - Reply as a human: conversations/live-agent.md
      - Leads: conversations/leads.md
  - Channels:
      - Overview: channels/overview.md
      - Website widget: channels/website.md
      - WhatsApp: channels/whatsapp.md
      - Messenger: channels/messenger.md
      - Instagram: channels/instagram.md
  - Customize the widget:
      - Overview: widget/install.md
      - Widget options: widget/options.md
      - Branding & "Powered by": widget/branding.md
  - Selling products (online stores):
      - Overview: selling/overview.md
      - Connect your store: selling/connect-your-store.md
      - Go-live checklist: selling/go-live-checklist.md
      - Keeping your catalogue current: selling/keeping-current.md
      - What shoppers can ask: selling/what-shoppers-can-ask.md
      - What it will not do: selling/limitations.md
      - "For developers: import methods": selling/import-methods.md
      - "For developers: Push API": selling/push-api.md
      - "For developers: product fields": selling/product-fields.md
      - "For developers: file & feed columns": selling/feed-csv-columns.md
      - "For developers: test the setup": selling/testing.md
  - Plans & billing:
      - Plans: billing/plans.md
      - Usage & limits: billing/usage-and-limits.md
      - Add-ons: billing/add-ons.md
      - How to pay: billing/payments.md
      - Discount codes: billing/discounts.md
  - Team:
      - Members & roles: team/members-roles.md
  - Developer guide: developer/overview.md
  - FAQ: faq.md
  - What's coming: roadmap.md
  - Support: support.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/visieai
